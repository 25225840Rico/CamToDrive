<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070b18">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CamToDrive">
    <title>CamToDrive</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- El visor ocupa la pantalla entera: no hay marco, la imagen ES la interfaz. -->
    <div class="stage" id="stage" aria-label="Visor de camara">
      <div class="ambient" aria-hidden="true"></div>

      <video id="viewer" playsinline autoplay muted disablepictureinpicture hidden></video>

      <div class="focus-frame searching" id="focusFrame" aria-hidden="true" hidden></div>

      <div class="camera-paused" id="cameraPaused" hidden>
        <p class="paused-title">Camara en pausa</p>
        <p class="paused-hint">Toca la pantalla para reanudarla</p>
      </div>

      <div class="camera-fallback" id="cameraFallback" hidden>
        <div class="native-camera-icon" aria-hidden="true"></div>
        <p id="cameraMessage">Abriendo la camara...</p>
        <div class="fallback-actions">
          <button class="glass-button" id="retryCameraButton" type="button">Reintentar camara</button>
          <button class="glass-button" id="nativeCameraButton" type="button">Camara nativa</button>
        </div>
      </div>
    </div>

    <!-- Capa de controles. No captura toques salvo en sus propios elementos, para que
         tocar la imagen siga llegando al visor. -->
    <main class="hud">
      <h1 class="visually-hidden">CamToDrive</h1>

      <header class="hud-top">
        <span class="chip glass" id="networkStatus">Sin conexion</span>
        <!-- Con que cuenta se esta subiendo, siempre a la vista. Es la unica defensa contra
             un token silencioso de la cuenta equivocada: si no se ve, no se nota. -->
        <button
          class="chip glass account-chip"
          id="accountChip"
          type="button"
          aria-live="polite"
          hidden
        ></button>
        <span class="chip glass quality-chip" id="captureQuality" hidden></span>
      </header>

      <div class="hud-bottom">
        <section
          class="global-progress glass"
          id="globalProgress"
          role="progressbar"
          aria-label="Progreso global de subida"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          hidden
        >
          <div class="global-progress-copy">
            <span>Subiendo a Drive</span>
            <strong id="globalProgressText">0%</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="globalProgressBar"></span>
          </div>
        </section>

        <section class="recent" aria-label="Ultimas fotos">
          <h2 class="visually-hidden">Ultimas fotos</h2>
          <ul class="recent-list" id="recentList" aria-label="Fotos recientes"></ul>
          <p class="counters">
            <span id="pendingCount">0</span> en cola
            <span class="dot" aria-hidden="true">&middot;</span>
            <span id="uploadingCount">0</span> subiendo
          </p>
        </section>

        <footer class="app-footer" aria-live="polite">
          <p class="status-line" id="statusText">Conectar Google</p>
          <p class="hint" id="authHint">Configura el Client ID para empezar.</p>
        </footer>

        <div class="dock">
          <button class="glass-button connect-button" id="connectButton" type="button">
            <span class="button-icon" aria-hidden="true">G</span>
            <span>Conectar Google</span>
          </button>

          <button class="shutter" id="captureButton" type="button" aria-label="Disparar foto">
            <span class="shutter-ring" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </main>

    <input
      id="cameraInput"
      class="visually-hidden"
      type="file"
      accept="image/*"
      capture="environment"
      aria-label="Abrir camara trasera nativa"
    >

    <div class="overlay" id="preview" role="dialog" aria-label="Revisar foto" hidden>
      <div class="overlay-body glass">
        <img id="previewImage" alt="Foto recien tomada">
        <p class="overlay-meta" id="previewMeta"></p>
        <div class="overlay-actions">
          <button class="glass-button" id="previewRetakeButton" type="button">Repetir</button>
          <button class="glass-button primary" id="previewAcceptButton" type="button">Usar foto</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="photoViewer" role="dialog" aria-label="Foto del historial" hidden>
      <div class="overlay-body glass">
        <div class="overlay-head">
          <div class="overlay-titles">
            <p class="overlay-name" id="photoViewerName"></p>
            <p class="overlay-meta" id="photoViewerMeta"></p>
          </div>
          <button class="overlay-close" id="photoViewerClose" type="button" aria-label="Cerrar">&times;</button>
        </div>
        <img id="photoViewerImage" alt="Foto seleccionada">
        <p class="overlay-warning" id="photoViewerWarning" hidden></p>
        <div class="overlay-actions">
          <a class="glass-button" id="photoViewerOpen" target="_blank" rel="noopener" hidden>Abrir en Drive</a>
          <button class="glass-button danger" id="photoViewerDelete" type="button">Eliminar</button>
        </div>
      </div>
    </div>
  </body>
</html>
