<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#008080">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CamToDrive">
    <title>CamToDrive</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="window" aria-labelledby="app-title">
      <div class="title-bar">
        <span class="title-bar-icon" aria-hidden="true"></span>
        <h1 class="title-bar-text" id="app-title">CamToDrive</h1>
        <span class="title-bar-buttons" aria-hidden="true">
          <span class="title-bar-button">_</span>
          <span class="title-bar-button">&#9633;</span>
          <span class="title-bar-button">&#10005;</span>
        </span>
      </div>

      <div class="window-body">
        <section class="viewer-panel" aria-label="Visor de camara">
          <div class="viewer-frame" id="viewerFrame">
            <video id="viewer" playsinline autoplay muted disablepictureinpicture hidden></video>

            <div class="camera-fallback" id="cameraFallback" hidden>
              <div class="native-camera-icon" aria-hidden="true"></div>
              <p id="cameraMessage">Abriendo la camara...</p>
              <div class="fallback-actions">
                <button class="win-button" id="retryCameraButton" type="button">Reintentar camara</button>
                <button class="win-button" id="nativeCameraButton" type="button">Camara nativa</button>
              </div>
            </div>
          </div>
          <p class="capture-quality" id="captureQuality" hidden></p>
        </section>

        <section
          class="global-progress"
          id="globalProgress"
          role="progressbar"
          aria-label="Progreso global de subida"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          hidden
        >
          <div class="global-progress-copy">
            <span>Subiendo a Drive</span>
            <strong id="globalProgressText">0%</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <span id="globalProgressBar"></span>
          </div>
        </section>

        <section class="actions" aria-label="Acciones principales">
          <button class="win-button connect-button" id="connectButton" type="button">
            <span class="button-icon" aria-hidden="true">G</span>
            <span>Conectar Google</span>
          </button>

          <button class="win-button capture-button" id="captureButton" type="button">
            <span class="shutter-ring" aria-hidden="true"></span>
            <span>Disparar</span>
          </button>
        </section>

        <input
          id="cameraInput"
          class="visually-hidden"
          type="file"
          accept="image/*"
          capture="environment"
          aria-label="Abrir camara trasera nativa"
        >

        <fieldset class="group-box last-photo">
          <legend>Ultimas fotos</legend>
          <div class="thumb-frame">
            <img id="lastThumb" alt="Ultima foto tomada" hidden>
            <span id="emptyThumb">Sin foto</span>
          </div>
          <ul class="recent-list" id="recentList" aria-label="Estado de disparos recientes"></ul>
        </fieldset>

        <p class="hint" id="authHint">Configura el Client ID para empezar.</p>
      </div>

      <div class="status-bar" aria-live="polite">
        <span class="status-cell status-cell-wide" id="statusText">Conectar Google</span>
        <span class="status-cell"><span id="pendingCount">0</span> en cola</span>
        <span class="status-cell"><span id="uploadingCount">0</span> subiendo</span>
        <span class="status-cell" id="networkStatus">Sin conexion</span>
      </div>
    </main>
  </body>
</html>
